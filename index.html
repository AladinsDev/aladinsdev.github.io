@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
@property --s{syntax:"<length>";inherits:false;initial-value:0px}
@property --v{syntax:"<color>";inherits:true;initial-value:#9b5cff}
@property --lav{syntax:"<color>";inherits:true;initial-value:#c9a8ff}
@property --pink{syntax:"<color>";inherits:true;initial-value:#e07bff}
@property --c1{syntax:"<color>";inherits:true;initial-value:#1a0c45}
@property --c2{syntax:"<color>";inherits:true;initial-value:#2a0f5e}
@property --b1{syntax:"<color>";inherits:true;initial-value:#2a0f5e}
@property --b2{syntax:"<color>";inherits:true;initial-value:#12082e}
@property --b3{syntax:"<color>";inherits:true;initial-value:#06020f}
:root{--txt:#f6f0ff;--mut:#bfb2d9;transition:--v 1s,--lav 1s,--pink 1s,--c1 1s,--c2 1s,--b1 1s,--b2 1s,--b3 1s;}
/* Un thème de couleur par catégorie */
:root[data-t=violet]{--v:#9b5cff;--lav:#c9a8ff;--pink:#e07bff;--c1:#1a0c45;--c2:#2a0f5e;--b1:#2a0f5e;--b2:#12082e;--b3:#06020f}
:root[data-t=rose]{--v:#ff4fd8;--lav:#ffb3ef;--pink:#ff8a5c;--c1:#3a0a33;--c2:#5e1050;--b1:#5e1050;--b2:#2e0829;--b3:#12020f}
:root[data-t=bleu]{--v:#2ea8ff;--lav:#a8dcff;--pink:#5ef0ff;--c1:#08224a;--c2:#0d3a6e;--b1:#0d3a6e;--b2:#071a38;--b3:#020912}
:root[data-t=indigo]{--v:#6c7bff;--lav:#b8bfff;--pink:#8fb0ff;--c1:#101a4a;--c2:#1b2a7a;--b1:#1b2a7a;--b2:#0b1236;--b3:#03061a}
:root[data-t=vert]{--v:#2ee59d;--lav:#a6f5d3;--pink:#b6ff5e;--c1:#06382a;--c2:#0a5a42;--b1:#0a5a42;--b2:#05261d;--b3:#010d0a}
:root[data-t=ambre]{--v:#ffb02e;--lav:#ffdc9a;--pink:#ff7a3d;--c1:#3d2305;--c2:#603808;--b1:#603808;--b2:#2a1804;--b3:#100800}
:root[data-t=rouge]{--v:#ff4d5e;--lav:#ffb0b8;--pink:#ff8a3d;--c1:#3d0a14;--c2:#60101f;--b1:#60101f;--b2:#2a060d;--b3:#100205}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scrollbar-gutter:stable}
body{font:400 1.05rem/1.6 Outfit,system-ui,sans-serif;color:var(--txt);min-height:100vh;overflow-x:hidden;
animation:ss 9s linear infinite;
background:conic-gradient(from 133deg at 0 0,#0000,#fff 2deg,#0000 4deg) var(--s) calc(var(--s) - 15vh)/200px 200px no-repeat fixed,
radial-gradient(ellipse closest-side,color-mix(in srgb,var(--v) 30%,transparent),transparent) 8% 80%/65% 55% no-repeat fixed,
radial-gradient(ellipse closest-side,color-mix(in srgb,var(--v) 26%,transparent),transparent) 95% 15%/55% 50% no-repeat fixed,
radial-gradient(ellipse at 50% 30%,var(--b1),var(--b2) 45%,var(--b3)) fixed}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
background:radial-gradient(3px 3px at 15% 20%,var(--v) 50%,#0000 55%),radial-gradient(2px 2px at 40% 70%,#fffc 50%,#0000 55%),radial-gradient(3px 3px at 75% 30%,var(--lav) 50%,#0000 55%),radial-gradient(2px 2px at 60% 85%,var(--pink) 50%,#0000 55%);
background-size:500px 500px,420px 420px,600px 600px,350px 350px;animation:tw 4s ease-in-out infinite,dr 40s linear infinite}
body:has(.cell:not(.ecard):hover)::before{animation-duration:.8s,6s}
@keyframes ss{0%,70%{--s:-50vw}to{--s:120vw}}
@keyframes ro{to{--a:360deg}}
@keyframes tw{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes dr{to{background-position:500px 500px,-420px 420px,0 -600px,700px 0}}
a{color:inherit}
:focus-visible{outline:2px solid var(--lav);outline-offset:3px;border-radius:6px}
h1,h2,h3{font-family:Unbounded,system-ui,sans-serif;line-height:1.15}
h2{font-weight:500;font-size:clamp(1.4rem,3vw,2rem);margin-bottom:28px}

nav{position:sticky;top:0;z-index:10;display:flex;gap:6px 22px;flex-wrap:wrap;align-items:center;justify-content:flex-end;padding:14px max(20px,calc(50vw - 540px));background:#06020fcc;backdrop-filter:blur(10px);border-bottom:1px solid color-mix(in srgb,var(--v) 20%,transparent)}
nav b{margin-inline-end:auto;font:800 1rem Unbounded,sans-serif;color:var(--lav)}
nav a{text-decoration:none;color:var(--mut);transition:color .2s}
nav a:hover{color:var(--lav)}
#navmenu{display:none;position:absolute;top:100%;inset-inline-end:max(20px,calc(50vw - 540px));flex-direction:column;gap:14px;padding:18px 26px;background:#0a0518f5;backdrop-filter:blur(12px);border:1px solid color-mix(in srgb,var(--v) 30%,transparent);border-top:none;border-radius:0 0 14px 14px;box-shadow:0 14px 30px #000c}
#navmenu.open{display:flex}
#mn{font:inherit;font-size:.95rem;font-weight:600;color:var(--txt);background:#0a0414;border:1px solid var(--v);border-radius:8px;padding:4px 12px;cursor:pointer;transition:box-shadow .2s,color .2s}
#mn:hover{color:var(--lav);box-shadow:0 0 12px color-mix(in srgb,var(--v) 50%,transparent)}

.hero{min-height:100vh;display:flex;align-items:center;padding:60px max(20px,calc(50vw - 540px))}
.hero h1{font-weight:800;font-size:clamp(2.8rem,10vw,6.5rem);letter-spacing:-.03em;text-shadow:0 0 50px color-mix(in srgb,var(--v) 70%,transparent)}
.hero p{margin:18px 0 30px;font-size:1.3rem;color:var(--lav);max-width:42ch}
.btns{display:flex;gap:14px;flex-wrap:wrap}
.btn{display:inline-block;padding:12px 22px;border-radius:10px;font-weight:600;text-decoration:none;border:1px solid var(--v);transition:transform .2s,box-shadow .2s}
.btn.main{background:var(--v);color:#0a0414;box-shadow:0 0 22px color-mix(in srgb,var(--v) 45%,transparent)}
.btn:hover{transform:translateY(-3px);box-shadow:0 0 28px var(--v)}

section{padding:clamp(88px,13vw,140px) max(20px,calc(50vw - 540px))}
.two{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:start}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px;perspective:1000px}

.cell{position:relative;overflow:hidden;padding:24px;border:1px solid color-mix(in srgb,var(--v) 30%,transparent);border-radius:14px;background:linear-gradient(145deg,var(--c1),var(--c2));box-shadow:0 10px 25px #000a;transition:transform .4s cubic-bezier(.18,.9,.32,1),box-shadow .3s,border-color .3s;display:flex;flex-direction:column}
.cell::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:2px;pointer-events:none;animation:ro 4s linear infinite;
background:conic-gradient(from var(--a),#0000 55%,var(--v),#fff 92%,#0000);
-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude}
.cell::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,#0000 35%,#fff5 50%,#0000 65%);transform:translateX(-100%)}
.cell:hover::after{transform:translateX(100%);transition:transform .7s}
.cell:hover{border-color:var(--v);transform:rotateX(8deg) rotateY(-8deg) translateY(-6px);box-shadow:0 15px 30px #000c,0 0 24px color-mix(in srgb,var(--v) 60%,transparent)}
.cell h3{font-size:1.1rem;font-weight:500;margin-bottom:8px}
.cell p{color:var(--mut);flex:1}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.tags span,.chips span{padding:4px 12px;border-radius:99px;font-size:.9rem;background:color-mix(in srgb,var(--v) 18%,transparent);border:1px solid color-mix(in srgb,var(--v) 45%,transparent)}
.cell .go{margin-top:auto;color:var(--lav);font-weight:600;align-self:flex-start;padding-top:12px}

ul{list-style:none}
.skills{max-width:640px}
.skills li{margin-bottom:18px}
.row{display:flex;justify-content:space-between;margin-bottom:6px}
.row span:last-child{color:var(--mut)}
.bar{height:8px;border-radius:99px;background:#ffffff14;overflow:hidden}
.bar i{display:block;height:100%;width:var(--w);border-radius:inherit;background:linear-gradient(90deg,var(--v),var(--pink));box-shadow:0 0 12px var(--v)}
.lang{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid color-mix(in srgb,var(--v) 25%,transparent)}
.lang small{color:var(--mut);font-size:.95rem}
.lang .stars{flex:none;margin-inline-start:16px}
.stars{display:flex;gap:4px;filter:drop-shadow(0 0 5px var(--pink))}
.stars i{width:18px;height:18px;background:#ffffff26;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.stars i.on{background:var(--pink)}
.chips{display:flex;flex-wrap:wrap;gap:10px}

.tl{border-inline-start:2px solid color-mix(in srgb,var(--lav) 55%,transparent);margin-inline-start:8px}
.tl li{position:relative;padding:0 0 28px;padding-inline-start:28px}
.tl li::before{content:"";position:absolute;inset-inline-start:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:#000;box-shadow:0 0 0 2px var(--lav),0 0 14px var(--v)}
.tl time{color:var(--lav);font-weight:600}
.tl h3{font-size:1.05rem;font-weight:500;margin:2px 0}
.tl p{color:var(--mut)}

.yt{display:flex;align-items:center;gap:28px;flex-wrap:wrap}
.play{flex:none;width:84px;height:84px;border-radius:50%;background:#000;box-shadow:0 0 0 2px var(--lav),0 0 30px var(--v);display:grid;place-items:center}
.play::after{content:"";width:26px;height:30px;margin-inline-start:6px;background:var(--lav);clip-path:polygon(0 0,100% 50%,0 100%)}
.yt h3{font-size:1.3rem}
.yt .btn{margin-top:16px}

footer{padding:40px max(20px,calc(50vw - 540px)) 60px;color:var(--mut);display:flex;gap:12px 28px;flex-wrap:wrap;align-items:center}
footer a{color:var(--lav)}
@media(max-width:760px){.two{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*,::before,::after{animation:none!important;transition:none!important}}
.hero p.age{margin:6px 0 0;font-size:1.1rem;color:var(--mut)}
.sw{background:#0a0414;color:var(--txt);border:1px solid var(--v);border-radius:8px;padding:4px 8px;font:inherit;font-size:.95rem}
#links{display:flex;gap:6px 22px;flex-wrap:wrap}
button.cp{all:unset;cursor:pointer;color:var(--lav)}
button.cp:hover{text-decoration:underline}
button.cp:focus-visible{outline:2px solid var(--lav);outline-offset:3px}
.grp{margin-top:48px}
.grp h3{font-size:1.05rem;font-weight:500;color:var(--lav);margin-bottom:14px}
/* Scrollbar personnalisée, aux couleurs de la catégorie en cours */
::-webkit-scrollbar{width:14px;height:14px}
::-webkit-scrollbar-track{background:#06020f;border-inline-start:1px solid color-mix(in srgb,var(--v) 25%,transparent)}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--v),var(--pink));border:3px solid #06020f;border-radius:99px;box-shadow:0 0 12px var(--v)}
::-webkit-scrollbar-thumb:hover{background:var(--lav)}
@supports not selector(::-webkit-scrollbar){html{scrollbar-width:thin;scrollbar-color:var(--v) #06020f}}
.ic{width:1.15em;height:1.15em;fill:currentColor;vertical-align:-.2em;margin-inline-end:.5em}
button.btn{font:inherit;font-weight:600;color:inherit;background:transparent;cursor:pointer}
.tl h3 a{text-decoration:none;border-bottom:1px solid var(--v)}
.tl .win{color:var(--pink);font-weight:600}
.tl .cert{display:inline-block;margin-top:6px;color:var(--lav);font-weight:600}
.tl p a{color:var(--lav)}
/* Séparation marquée entre les catégories : couleur propre, filet lumineux, halo et titre souligné */
section[data-t=rose]{--sec:#ff4fd8}
section[data-t=bleu]{--sec:#2ea8ff}
section[data-t=vert]{--sec:#2ee59d}
section[data-t=ambre]{--sec:#ffb02e}
section[data-t=rouge]{--sec:#ff4d5e}
footer[data-t=violet]{--sec:#9b5cff}
section,footer{position:relative}
section{background:linear-gradient(180deg,color-mix(in srgb,var(--sec) 10%,transparent),transparent 260px)}
section::before,footer::before{content:"";position:absolute;top:0;inset-inline:max(20px,calc(50vw - 540px));height:2px;background:linear-gradient(90deg,transparent,var(--sec),transparent);box-shadow:0 0 20px var(--sec)}
section h2::after{content:"";display:block;width:56px;height:4px;margin-top:12px;border-radius:99px;background:var(--sec);box-shadow:0 0 14px var(--sec)}
footer{margin-top:20px}
.btns.socials{margin-top:26px;padding-top:26px;border-top:1px solid color-mix(in srgb,var(--v) 28%,transparent)}
.btns.socials{flex-wrap:nowrap;gap:8px;overflow:visible;padding-bottom:14px}
.btns.socials .btn{flex:none;padding:8px 10px;font-size:.85rem;white-space:nowrap}
.btns.socials .btn .ic{margin-inline-end:.3em}
@media(max-width:700px){.btns.socials{gap:6px}.btns.socials .btn{padding:8px;font-size:0}.btns.socials .btn .ic{width:18px;height:18px;margin:0}}
/* Photo + section Formation (défilement horizontal piloté par le scroll) */
.hero{gap:48px;justify-content:space-between;flex-wrap:wrap}
.hero>div:first-child{flex:1 1 520px;min-width:0}
.photo{flex:none;width:clamp(200px,26vw,300px);padding:0;display:flex;flex-direction:column;border-radius:24px;align-self:flex-start;margin-top:140px}
.photo img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block}
.photo .pico{aspect-ratio:4/5;display:grid;place-items:center}
.photo svg{width:46%;fill:var(--lav);opacity:.35}
.photo .cvb{display:block;width:100%;margin-top:auto;padding:14px 22px;border-radius:0;border:0;border-top:1px solid color-mix(in srgb,var(--v) 35%,transparent);background:color-mix(in srgb,var(--v) 12%,transparent);text-align:center;cursor:pointer;transition:background .2s}
.photo .cvb:hover{background:color-mix(in srgb,var(--v) 28%,transparent);transform:none;box-shadow:none}
section[data-t=indigo]{--sec:#6c7bff}
.edu{padding:0}
.epin{position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;justify-content:center;gap:28px;overflow:hidden;padding:0 max(20px,calc(50vw - 540px))}
.epin h2{margin-bottom:0}
.etrack{display:flex;gap:24px;width:max-content;direction:ltr;perspective:1000px;will-change:transform}
.ecard{flex:none;width:min(320px,78vw);display:flex;flex-direction:column;gap:14px;transition:none}
.ecard::before,.ecard::after{display:none}
.ecard:hover{transform:none;border-color:color-mix(in srgb,var(--v) 30%,transparent);box-shadow:0 10px 25px #000a;transition:none}
html[dir=rtl] .ecard{direction:rtl}
.ecard h3{margin:0}
.eimg{aspect-ratio:4/3;display:grid;place-items:center;text-align:center;border:2px dashed color-mix(in srgb,var(--v) 45%,transparent);border-radius:10px;color:var(--mut);font-size:.9rem;overflow:hidden}
.eimg img{width:100%;height:100%;object-fit:cover;display:block}
.egr{display:flex;justify-content:space-between;padding-top:12px;border-top:1px solid color-mix(in srgb,var(--v) 25%,transparent)}
.egr b{color:var(--lav)}
.egl{display:flex;justify-content:space-between;color:var(--mut);font-size:.95rem}
.badge{align-self:flex-start;padding:2px 10px;border-radius:99px;font-size:.8rem;font-weight:600;background:var(--v);color:#0a0414}
.eslide{-webkit-appearance:none;appearance:none;width:100%;height:24px;margin:0;background:transparent;cursor:grab}
.eslide:active{cursor:grabbing}
.eslide::-webkit-slider-runnable-track{height:6px;border-radius:99px;background:#ffffff26}
.eslide::-webkit-slider-thumb{-webkit-appearance:none;width:56px;height:18px;margin-top:-6px;border:0;border-radius:99px;background:linear-gradient(90deg,var(--v),var(--pink));box-shadow:0 0 14px var(--v)}
.eslide::-moz-range-track{height:6px;border-radius:99px;background:#ffffff26}
.eslide::-moz-range-thumb{width:56px;height:18px;border:0;border-radius:99px;background:linear-gradient(90deg,var(--v),var(--pink));box-shadow:0 0 14px var(--v)}
.epin{touch-action:pan-y pinch-zoom}
.ecard.wide{width:min(660px,92vw)}
.edocs{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:16px;align-items-stretch}
.edoc{display:flex;flex-direction:column;gap:10px;min-height:200px}
.edoc>b{font-weight:600;color:var(--lav)}
.epdf{display:block;text-align:center;font-size:.9rem;padding:8px 12px;margin-top:auto}
.edu{position:relative}
.ewall{position:absolute;inset:0;z-index:5;display:grid;place-items:center;padding:20px;pointer-events:none;transition:opacity .7s ease,visibility 0s .7s}
.edu:not(.locked) .ewall{opacity:0;visibility:hidden}
.elock{pointer-events:auto;position:relative;width:min(420px,100%);padding:26px;border-radius:16px;border:1px solid color-mix(in srgb,var(--v) 40%,transparent);background:color-mix(in srgb,var(--c1) 82%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 10px 40px #000b;display:flex;flex-direction:column;gap:14px;transition:transform .7s cubic-bezier(.2,.8,.2,1),border-color .3s,box-shadow .3s}
.edu:not(.locked) .elock{transform:scale(.9) translateY(-12px)}
.elock p{margin:0;color:var(--mut)}
.elock .erow{display:flex;gap:10px;flex-wrap:wrap;transition:opacity .3s}
.elock p{transition:opacity .3s}
.epw{position:relative;flex:1 1 180px;min-width:0}
.epw input{width:100%;box-sizing:border-box;padding:12px 46px 12px 14px;border-radius:10px;border:1px solid color-mix(in srgb,var(--v) 45%,transparent);background:#00000040;color:var(--txt);font:inherit}
.epw input:focus{outline:2px solid var(--v);outline-offset:2px}
.epw input:disabled,.elock .btn:disabled{opacity:.5;cursor:not-allowed}
.eye{position:absolute;right:6px;top:50%;translate:0 -50%;display:grid;place-items:center;padding:6px;border:0;border-radius:8px;background:none;color:var(--lav);cursor:pointer}
.eye:hover{color:var(--txt)}
.eye svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.eye .off{display:none}
.eye[aria-pressed=true] .on{display:none}
.eye[aria-pressed=true] .off{display:block}

const SFX = (() => {
  let ac = null, on = true, last = null;

  const ensure = () => {
    if (!ac) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; try { ac = new C(); } catch (e) { return null; } }

async function kdf(t) {
  const enc = new TextEncoder();
  const k = await crypto.subtle.importKey("raw", enc.encode(t), "PBKDF2", false, ["deriveBits"]);
  const b = await crypto.subtle.deriveBits({name: "PBKDF2", hash: "SHA-256", salt: enc.encode(D.studiesSalt), iterations: 210000}, k, 256);
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
}

const FK = "edu_f";

// Musique d’ambiance : bouton on/off + volume. Elle démarre sur un clic (les navigateurs interdisent le son automatique).
(() => {
  if (!D.music) return;
  const box = $("#music"), btn = $("#mbtn"), vol = $("#mvol");
  box.hidden = false;
  $("#mcredit").textContent = D.musicCredit || "";
  const audio = $("#bgm") || new Audio(D.music);
  if (audio.getAttribute("src") !== D.music) audio.src = D.music;
  audio.loop = true;
  const speaker = '<path d="M3 9v6h4l5 4V5L7 9H3z"/>';
  const wrap = p => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${speaker}${p}</svg>`;
  const ON = wrap('<path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>');
  const OFF = wrap('<path d="m16 9 6 6m0-6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>');
  let want = 0.4, on = false, fade;
  try { const v = localStorage.getItem("vol"); if (v !== null) want = Math.min(1, Math.max(0, +v)); } catch (e) {}
  vol.value = Math.round(want * 100);
  const show = () => { btn.innerHTML = on ? ON : OFF; btn.setAttribute("aria-pressed", on); box.classList.toggle("on", on); };
  const ramp = (to, done) => {
    clearInterval(fade);
    fade = setInterval(() => {
      const step = 0.05, v = audio.volume;
      audio.volume = to > v ? Math.min(to, v + step) : Math.max(to, v - step);
      if (audio.volume === to) { clearInterval(fade); if (done) done(); }
    }, 50);
  };
  const pref = v => { try { localStorage.setItem("mus", v); } catch (e) {} };
  const play = () => {
    on = true; show(); audio.muted = false; audio.volume = 0;
    return audio.play().then(() => { ramp(want); pref("1"); return true; }).catch(() => { on = false; show(); return false; });
  };
  const stop = () => { on = false; show(); pref("0"); ramp(0, () => { if (!on) audio.pause(); }); };
  btn.onclick = () => (on ? stop() : play());
  vol.oninput = () => {
    want = vol.value / 100;
    if (on) ramp(want);
    try { localStorage.setItem("vol", want); } catch (e) {}
  };
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) audio.pause(); else if (on) audio.play().catch(() => {});
  });
  // Démarrage automatique : on tente tout de suite ; si le navigateur refuse (cas le plus courant),
  // on réessaie à la première interaction (clic, touche, toucher). Si l’utilisateur a coupé la musique
  // lors d’une visite précédente, elle ne redémarre pas toute seule.
  if (D.musicAutoplay) {
    let off = false; try { off = localStorage.getItem("mus") === "0"; } catch (e) {}
    if (!off) {
      const ev = ["pointerup", "click", "keydown", "touchend"];
      const go = e => {
        if (on || box.contains(e.target)) return;
        play().then(ok => { if (ok) ev.forEach(t => removeEventListener(t, go, true)); });
      };
      ev.forEach(t => addEventListener(t, go, {capture: true, passive: true}));
      play();
    }
  }
  show();
})();

const mn = $("#mn"), navmenu = $("#navmenu");

mn.onclick = e => {
  e.stopPropagation();

};

// 🥚 Easter eggs
// 1) Code Konami (↑ ↑ ↓ ↓ ← → ← → B A) : boule de feu + « Hadouken ! » (konami.mp3)
// 2) Taper « aladin » ou cliquer 5 fois sur le logo « Aladins » en haut : un tapis volant traverse l’écran
const EGG = (() => {
  const KON = ["ArrowUp","ArrowUp","ArrowDown","ArrowDown","ArrowLeft","ArrowRight","ArrowLeft","ArrowRight","b","a"];
  let ac = null, kp = 0, wb = "";
  const muted = () => { try { return localStorage.getItem("uis") === "0"; } catch (e) { return false; } };
  const ctx = () => {
    if (!ac) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; try { ac = new C(); } catch (e) { return null; } }
    if (ac.state === "suspended") ac.resume().catch(() => {});
    return ac;
  };
  const playFile = src => {
    if (muted()) return;
    try { const a = new Audio(src); a.volume = 0.9; a.play().catch(() => {}); } catch (e) {}
  };
  const hadoukenSound = () => {
    if (muted()) return;
    const c = ctx(); if (!c) return;
    const t = c.currentTime;
    const o = c.createOscillator(), g = c.createGain();
    o.type = "sawtooth"; o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(520, t + .45);
    g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(.07, t + .1); g.gain.exponentialRampToValueAtTime(.0001, t + .5);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + .55);
    const len = Math.floor(c.sampleRate * 1.2), buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const n = c.createBufferSource(); n.buffer = buf;
    const f = c.createBiquadFilter(); f.type = "bandpass"; f.Q.value = 1.2;
    f.frequency.setValueAtTime(300, t + .35); f.frequency.exponentialRampToValueAtTime(3000, t + 1.3);
    const ng = c.createGain();
    ng.gain.setValueAtTime(.0001, t + .35); ng.gain.linearRampToValueAtTime(.22, t + .5); ng.gain.exponentialRampToValueAtTime(.0001, t + 1.5);
    n.connect(f); f.connect(ng); ng.connect(c.destination); n.start(t + .35); n.stop(t + 1.6);
  };
  const hadouken = () => {
    if (document.querySelector(".hdk")) return;
    const el = document.createElement("div");
    el.className = "hdk"; el.setAttribute("aria-hidden", "true");
    el.innerHTML = '<b>HADOUKEN!<small>波動拳</small></b><div class="ball"></div>';
    document.body.appendChild(el);
    hadoukenSound();
    playFile("konami.mp3");
    setTimeout(() => el.remove(), 1900);
  };
  const sparkle = () => {
    if (muted()) return;
    const c = ctx(); if (!c) return;
    [784, 988, 1175, 1568, 1976].forEach((f, i) => {
      const t = c.currentTime + i * .09, o = c.createOscillator(), g = c.createGain();
      o.type = "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(.05, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + .4);
      o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + .45);
    });
  };
  const carpet = () => {
    if (document.querySelector(".carpet,.wish")) return;
    const T = L[document.documentElement.lang] || L.en;
    const w = document.createElement("div"); w.className = "wish"; w.setAttribute("role", "status"); w.textContent = "✨ " + T[102];
    document.body.appendChild(w); setTimeout(() => w.remove(), 3500);
    sparkle();
    if (RM.matches) return;
    const el = document.createElement("div"); el.className = "carpet"; el.setAttribute("aria-hidden", "true");
    el.innerHTML = '<svg viewBox="0 0 140 56"><defs><linearGradient id="cpg" x1="0" x2="1"><stop offset="0" style="stop-color:var(--v)"/><stop offset="1" style="stop-color:var(--pink)"/></linearGradient></defs><path d="M20 37l-1 8M32 35l-1 8M44 33l-1 8M56 32l-1 8M68 31l-1 8M80 31l-1 8M92 31l-1 8M104 32l-1 8M116 33l-1 8" stroke="#ffe9a8" stroke-width="2" stroke-linecap="round"/><path d="M8 20Q70 4 132 16L124 34Q70 24 16 38Z" fill="url(#cpg)" stroke="#ffe9a8" stroke-width="2.5" stroke-linejoin="round"/><path d="M24 27Q70 17 114 25" fill="none" stroke="#ffe9a8" stroke-width="2" stroke-dasharray="3 5" stroke-linecap="round"/></svg>';
    document.body.appendChild(el);
    const iv = setInterval(() => {
      const r = el.getBoundingClientRect(), i = document.createElement("i");
      i.className = "spk";
      i.style.left = (r.left + r.width * (.1 + Math.random() * .7)) + "px";
      i.style.top = (r.top + r.height * (.4 + Math.random() * .5)) + "px";
      i.style.scale = String(.6 + Math.random() * .9);
      document.body.appendChild(i);
      setTimeout(() => i.remove(), 1150);
    }, 55);
    el.addEventListener("animationend", e => { if (e.animationName === "carx") { clearInterval(iv); el.remove(); } });
  };
  addEventListener("keydown", e => {
    const t = e.target;
    if (t && t.matches && t.matches("input,textarea,select,[contenteditable]")) return;
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    kp = k === KON[kp] ? kp + 1 : (k === KON[0] ? 1 : 0);
    if (kp === KON.length) { kp = 0; hadouken(); }
    if (k.length === 1) { wb = (wb + k).slice(-6); if (wb === "aladin") { wb = ""; carpet(); } }
  });
  let clicks = 0, ct;
  const brand = document.querySelector("nav b");
  if (brand) brand.addEventListener("click", () => {
    clearTimeout(ct); clicks++;
    if (clicks >= 5) { clicks = 0; carpet(); return; }
    ct = setTimeout(() => clicks = 0, 2500);
  });
  return {hadouken, carpet};
})();

// La couleur du site change selon la section au milieu de l’écran
const io = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) document.documentElement.dataset.t = e.target.dataset.t;
}), {rootMargin: "-50% 0px -50% 0px"});
document.querySelectorAll('[data-t]:not(html)').forEach(el => io.observe(el));
